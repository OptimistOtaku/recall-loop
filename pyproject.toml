[project]
name = "recall-loop"
version = "0.1.0"
description = "Evidence-backed coding agent memory with an editable 3D knowledge graph"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "qdrant-edge-py==0.9.0", "fastembed>=0.7,<1", "openai>=1.75,<3",
  "mcp>=1.9,<2", "httpx>=0.28,<1", "tiktoken>=0.9,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
recall-loop = "recall_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

